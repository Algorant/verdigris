# Verdigris eza theme for the Omarchy Zsh profile.
# Palette: palette/verdigris.json and the approved fern-led preview.
# Omarchy owns the ls/lt aliases; ~/.config/zsh/.zshrc adds la='ls -a'.

filekinds:
  normal: { foreground: "#ebdbb2" }       # vellum
  directory: { foreground: "#8ec07c" }    # fern
  executable: { foreground: "#e6bf86" }   # ochre
  symlink: { foreground: "#83a598" }      # aqua

header: { foreground: "#e6bf86", is_bold: true }

perms:
  user_read: { foreground: "#928374" }
  user_write: { foreground: "#928374" }
  user_execute_file: { foreground: "#928374" }
  user_execute_other: { foreground: "#928374" }
  group_read: { foreground: "#928374" }
  group_write: { foreground: "#928374" }
  group_execute: { foreground: "#928374" }
  other_read: { foreground: "#928374" }
  other_write: { foreground: "#928374" }
  other_execute: { foreground: "#928374" }
  special_user_file: { foreground: "#928374" }
  special_other: { foreground: "#928374" }
  attribute: { foreground: "#928374" }

size:
  major: { foreground: "#83a598" }
  minor: { foreground: "#83a598" }
  number_byte: { foreground: "#83a598" }
  number_kilo: { foreground: "#83a598" }
  number_mega: { foreground: "#83a598" }
  number_giga: { foreground: "#83a598" }
  number_huge: { foreground: "#83a598" }
  unit_byte: { foreground: "#83a598" }
  unit_kilo: { foreground: "#83a598" }
  unit_mega: { foreground: "#83a598" }
  unit_giga: { foreground: "#83a598" }
  unit_huge: { foreground: "#83a598" }

users:
  user_you: { foreground: "#d4be9a" }
  user_root: { foreground: "#d4be9a" }
  user_other: { foreground: "#d4be9a" }
  group_yours: { foreground: "#d4be9a" }
  group_other: { foreground: "#d4be9a" }
  group_root: { foreground: "#d4be9a" }

date: { foreground: "#83a598" }
