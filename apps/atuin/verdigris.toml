# Verdigris for Atuin
# See: https://docs.atuin.sh/cli/guide/theming/

[theme]
name = "verdigris"
parent = "autumn"

[colors]
Base = "#ebdbb2"       # vellum: primary text
Title = "#8ec07c"      # fern: titles / active labels
Important = "#e6bf86"  # ochre: selected/high-value text
Guidance = "#83a598"   # aqua: prompts and hints
Annotation = "#928374" # muted gray: secondary metadata
Muted = "#665c54"      # ashbronze: low-emphasis UI
AlertInfo = "#689d6a"  # patina: informational state
AlertWarn = "#e6bf86"  # ochre: warnings
AlertError = "#fb4934" # red: errors
