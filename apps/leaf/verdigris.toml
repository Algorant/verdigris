status_success_fg = "#8ec07c"
status_success_bg = "#293127"
status_warning_fg = "#fabd2f"
status_error_fg = "#c66f70"
status_error_bg = "#3a2422"
status_shortcut_fg = "#928374"
status_percent_fg = "#83a598"
toc_hover_fg = "#ebdbb2"
toc_header_fg = "#928374"
toc_active_bg = "#32302f"
toc_inactive_bg = "reset"
toc_accent = "#8ec07c"
toc_index_inactive = "#665c54"
toc_primary_active = "#ebdbb2"
toc_primary_inactive = "#bdae93"
toc_secondary_inactive = "#665c54"
toc_secondary_text_active = "#ebdbb2"
