# Verdigris for leaf
# Palette: palette/verdigris.json (roles follow verdigris.nvim)
base = "ocean"
# Transparent: "reset" backgrounds let the terminal (Ghostty opacity) show
# through, like verdigris.nvim and Tandem. Small chips stay solid.
syntax = "base16-mocha.dark"   # closest built-in; leaf can't load a custom tmTheme

[ui]
toc_bg = "reset"
toc_border = "#3c3836"
content_bg = "reset"
scrollbar_hover = "#8ec07c"
status_bg = "reset"
status_separator = "#665c54"
status_brand_fg = "#1d2021"
status_brand_bg = "#689d6a"
status_filename_fg = "#ebdbb2"
status_filename_bg = "#3c3836"
status_watch_fg = "#8ec07c"
status_watch_bg = "#293127"
status_reloaded_fg = "#1d2021"
status_reloaded_bg = "#8ec07c"
status_search_fg = "#e6bf86"
