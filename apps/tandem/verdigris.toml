# verdigris for tandem

#
# This keeps Tandem on its Verdigris palette while allowing terminal
# transparency/compositor backgrounds to show through where the TUI supports it.
base = "verdigris"
name = "verdigris"
transparent_background = true

# Board workflow-state chips. TODO intentionally keeps the muted fallback.
[aliases]
burnt-copper = "#b9805f"
heather = "#8989b0"

[badges.states]
in-progress = "burnt-copper"
validation = "heather"
